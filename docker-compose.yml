services:
  slab-email-migrate:
    build:
      context: .
    image: slab-email:latest
    environment:
      DATABASE_PATH: /data/slab-email.db
    volumes:
      - ./data:/data
    command: ["node", "dist/db/migrate.js"]
    restart: "no"

  slab-email:
    build:
      context: .
    image: slab-email:latest
    container_name: slab-email
    env_file:
      - .env
    # Runtime secrets and optional OAuth config are loaded from .env:
    # SLAB_EMAIL_ADMIN_KEY, SLAB_EMAIL_MASTER_KEY, GOOGLE_*
    # Proton Bridge must be run separately (local-first). If your Bridge is on the host,
    # point account fields imapHost/smtpHost to host.docker.internal or use host network.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # On Linux, alternatively uncomment below if you prefer host networking:
    # network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: 6981
      DATABASE_PATH: /data/slab-email.db
      SKIP_MIGRATIONS: "true"
      LOG_LEVEL: info
      MAX_SENDS_PER_ACCOUNT_PER_HOUR: 60
      MCP_ALLOWED_ORIGINS: 127.0.0.1:6981
      MCP_ALLOWED_ORIGINS_HOSTS: 127.0.0.1,localhost,[::1],localhost
      PUBLIC_ADMIN_ALLOWED_ORIGINS: 127.0.0.1:6981
    volumes:
      - ./data:/data
    depends_on:
      slab-email-migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6981:6981"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6981/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command: ["node", "dist/index.js"]
